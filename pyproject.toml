[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kcs-authoring-mvp"
version = "0.1.0"
description = "Runtime-independent KCS Authoring workflow core."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = []

[project.scripts]
kcs-core = "kcs_core.cli:main"
kcs-desktop-mcp = "kcs_adapters.mcp_desktop:main"
kcs-smoke-account = "kcs_adapters.smoke_accounting:main"

[project.optional-dependencies]
dev = [
  "pytest>=9.0,<10",
  "radon>=6.0,<7",
  "ruff>=0.8,<1",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["kcs_core*", "kcs_adapters*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "C90"]

[tool.ruff.lint.mccabe]
max-complexity = 7
